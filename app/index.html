<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: draw edge to edge and keep clear of the notch and
         home indicator ourselves (safe-area insets below). maximum-scale=1:
         iOS Safari zooms in on focusing an input under 16px, which shoved the
         layout sideways and the message box out of view. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Super Chat</title>
    <style>
      /* react-native-web's flex:1 (SafeAreaView, our screens, FlatList,
         absolutely-positioned things like the FAB) only fills real space if
         the DOM ancestor chain down to #root actually has a height. */
      html, body {
        height: 100%;
        margin: 0;
        /* The app scrolls inside itself; the page never does (on iOS a page
           scroll is what slid the message box under the toolbar). */
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        flex-direction: column;
        /* The visible area, not iOS Safari's largest one (which runs behind
           its bottom toolbar). The script below narrows it further while the
           keyboard is up. */
        height: 100%;
        height: 100dvh;
        height: var(--app-height, 100dvh);
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        box-sizing: border-box;
      }
    </style>
    <script>
      // iOS Safari doesn't shrink the page for the on-screen keyboard, it
      // covers it. Fit the app to what's actually visible above the
      // keyboard, so the message box sits right on top of it.
      (function () {
        var vv = window.visualViewport;
        if (!vv) return;
        function fit() {
          document.documentElement.style.setProperty('--app-height', vv.height + 'px');
          window.scrollTo(0, 0);
        }
        vv.addEventListener('resize', fit);
        vv.addEventListener('scroll', fit);
        fit();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.web.tsx"></script>
  </body>
</html>
