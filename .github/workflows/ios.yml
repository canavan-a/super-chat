# iOS builds: pushing a tag like ios-v0.4.0 builds the App Store app, signs
# it, and uploads it to App Store Connect, where it shows up under TestFlight
# and can be picked for a version. Google Play stays manual
# (release/release-play.sh), and the sideload APK keeps its own release
# (release/release.sh, app-v* tags).
#
# Versions come from the tag: CFBundleShortVersionString is "0.4.0", and the
# build number (CFBundleVersion) is major*10000 + minor*100 + patch, so it
# always goes up with the version. Minor and patch stay below 100. Apple
# takes each build number once: a failed or rejected upload needs a new tag.
#
# Signing is manual, with an Apple Distribution certificate and the "Super
# Chat iOS App Store" provisioning profile (project.pbxproj's Release config):
# Xcode's automatic signing needs a registered device, and the team has none.
# Both expire every October; renew them in Certificates, IDs & Profiles and
# reset their secrets. The upload uses an App Store Connect API key (Users
# and Access → Integrations, App Manager access). Repo secrets:
#  IOS_DIST_P12_BASE64     base64 -w0 of the certificate and its key, as .p12
#  IOS_DIST_P12_PASSWORD   that .p12's password
#  IOS_PROFILE_BASE64      base64 -w0 of the .mobileprovision
#  ASC_KEY_ID              the API key's ID
#  ASC_ISSUER_ID           the issuer ID shown above the keys
#  ASC_KEY_P8_BASE64       base64 -w0 AuthKey_XXXX.p8

name: iOS build

on:
  push:
    tags: ['ios-v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        run: |
          v="${GITHUB_REF_NAME#ios-v}"
          if [[ ! "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::the tag must look like ios-v1.2.3"; exit 1
          fi
          major=$((10#${BASH_REMATCH[1]})) minor=$((10#${BASH_REMATCH[2]})) patch=$((10#${BASH_REMATCH[3]}))
          if (( minor > 99 || patch > 99 )); then
            echo "::error::minor and patch must be below 100"; exit 1
          fi
          echo "name=$v" >>"$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >>"$GITHUB_OUTPUT"

  ios:
    needs: version
    runs-on: macos-15
    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # React Native 0.81 needs Node 20.19.4 or later.
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Pods
        working-directory: app/ios
        run: pod install

      # Set on the app's own project only: passed to xcodebuild, they'd
      # override every pod's version too.
      - name: Version
        working-directory: app/ios
        run: |
          sed -i '' \
            -e "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $VERSION_NAME;/" \
            -e "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $VERSION_CODE;/" \
            SuperchatApp.xcodeproj/project.pbxproj

      # The distribution certificate goes into a throwaway keychain, and the
      # profile where Xcode looks for profiles.
      - name: Signing certificate and profile
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [[ -z "$IOS_DIST_P12_BASE64" || -z "$IOS_DIST_P12_PASSWORD" || -z "$IOS_PROFILE_BASE64" ]]; then
            echo "::error::set the IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD and IOS_PROFILE_BASE64 secrets"; exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pass="$(uuidgen)"
          printf '%s' "$IOS_DIST_P12_BASE64" | base64 -d >"$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "SIGNING_KEYCHAIN=$keychain" >>"$GITHUB_ENV"

          printf '%s' "$IOS_PROFILE_BASE64" | base64 -d >"$RUNNER_TEMP/profile.mobileprovision"
          uuid="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$uuid.mobileprovision"
          done

      - name: Archive
        working-directory: app/ios
        run: |
          xcodebuild archive -quiet \
            -workspace SuperchatApp.xcworkspace \
            -scheme SuperchatApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SuperchatApp.xcarchive"

      # destination=upload sends the signed build straight to App Store
      # Connect instead of writing an .ipa; the API key logs in for it.
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [[ -z "$ASC_KEY_ID" || -z "$ASC_ISSUER_ID" || -z "$ASC_KEY_P8_BASE64" ]]; then
            echo "::error::set the ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8_BASE64 secrets"; exit 1
          fi
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d >"$RUNNER_TEMP/AuthKey.p8"
          cat >"$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>4W9H62B6C2</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.superchatapp</key><string>Super Chat iOS App Store</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SuperchatApp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up signing
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          [[ -n "$SIGNING_KEYCHAIN" ]] && security delete-keychain "$SIGNING_KEYCHAIN" || true
